<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERAL | Catálogo Exclusivo Dubái</title>
    <!-- Enlace a Bootstrap 5 CSS para diseño responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Enlace a Google Fonts para tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- ==========================================
         CONTENEDOR GENERAL DE LA LANDING PAGE
         ========================================== -->
    <div class="landing-container luxury-wrapper shadow-lg my-3">

        <!-- ==========================================
             NAVEGACIÓN PRINCIPAL
             ========================================== -->
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-burgundy px-4 py-3" aria-label="Navegación Principal">
                <!-- Logotipo de la marca -->
                <a class="navbar-brand font-display fs-2 text-white" href="#">FERAL</a>
                
                <!-- Botón de menú desplegable para dispositivos móviles -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Cambiar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Opciones del menú superior  -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link text-white filter-btn active fw-bold" href="#" data-categoria="all">TODOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white filter-btn" href="#" data-categoria="1">BIENES RAICES</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white filter-btn" href="#" data-categoria="2">YATES</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white filter-btn" href="#" data-categoria="3">AUTOS</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- ==========================================
             CONTENIDO LANDING
             ========================================== -->
        <main id="main-content" class="p-4 p-md-5">
            
            <!-- Título y subtítulo  -->
            <section class="text-center mb-5 border-bottom pb-4">
                <span class="text-uppercase text-muted small tracking-widest fw-semibold d-block mb-2" style="letter-spacing: 3px;">Exclusive Portfolio • Dubai Edition</span>
                <h1 class="font-heading display-4 text-burgundy fw-bold">Inversiones Exclusivas en Dubái</h1>
                <p class="font-body fs-5 text-muted fst-italic mt-2">"Donde la experiencia se convierte en poder."</p>
            </section>

            <!-- Contenedor dinámico del catálogo  -->
            <div id="catalog-container" class="row g-4">
                <!-- Las tarjetas se cargan automáticamente desde catalog.json -->
            </div>

        </main>

        <!-- ==========================================
             (FOOTER)
             ========================================== -->
        <footer class="bg-burgundy text-white text-center py-4">
            <p class="mb-0 font-ui small">&copy; 2026 Feral Dubai. Todos los derechos reservados.</p>
        </footer>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal JS (Cargado una sola vez de forma limpia y modular) -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
